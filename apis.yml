aid: eventual
name: Eventual
description: 'Eventual is a data infrastructure company building Daft, an open-source, high-performance
  data engine for AI and multimodal workloads. Written in Rust with Python and SQL interfaces, Daft lets
  teams query and process images, audio, video, documents, embeddings, and structured data from a local
  laptop to petabyte-scale distributed clusters on Ray or Kubernetes. Eventual also builds MultiBase, a
  semantic data platform for Physical AI teams. Daft runs in production at exabyte scale at organizations
  including Amazon, Mobileye, and Together AI, and Eventual is backed by CRV and Felicis.'
